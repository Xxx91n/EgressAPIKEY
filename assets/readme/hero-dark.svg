<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="EgressAPIKEY: sticky exit-IP routing for AI API keys">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0e1528"/>
    </linearGradient>
    <linearGradient id="accent-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#bg-dark)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="rgba(255,255,255,0.12)" rx="0"/>

  <!-- decorative port lanes on the left -->
  <g>
      <rect x="70" y="82" width="150" height="28" rx="8" fill="#151b2e" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="88" cy="96" r="4" fill="#38bdf8"/>
      <text x="102" y="100" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#94a3b8">:18000 → key 1</text>
    </g>
  <g>
      <rect x="70" y="134" width="150" height="28" rx="8" fill="#151b2e" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="88" cy="148" r="4" fill="#38bdf8"/>
      <text x="102" y="152" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#94a3b8">:18001 → key 2</text>
    </g>
  <g>
      <rect x="70" y="186" width="150" height="28" rx="8" fill="#151b2e" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="88" cy="200" r="4" fill="#38bdf8"/>
      <text x="102" y="204" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#94a3b8">:18002 → key 3</text>
    </g>
  <g>
      <rect x="70" y="238" width="150" height="28" rx="8" fill="#151b2e" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="88" cy="252" r="4" fill="#38bdf8"/>
      <text x="102" y="256" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#94a3b8">:18003 → key 4</text>
    </g>
  <g>
      <rect x="70" y="290" width="150" height="28" rx="8" fill="#151b2e" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="88" cy="304" r="4" fill="#38bdf8"/>
      <text x="102" y="308" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" fill="#94a3b8">:18004 → key 5</text>
    </g>

  <!-- title block -->
  <text x="300" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#f1f5f9">EgressAPIKEY</text>
  <rect x="302" y="156" width="330" height="4" rx="2" fill="url(#accent-dark)"/>
  <text x="300" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#94a3b8">Sticky exit-IP routing for AI API keys</text>
  <text x="300" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8">One (platform, account) pair per entry port — never share an egress IP.</text>

  <!-- chips -->
  <g>
      <rect x="300" y="252" width="170.4" height="28" rx="14" fill="rgba(96,165,250,0.15)" stroke="#93c5fd" stroke-opacity="0.45"/>
      <text x="313" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#60a5fa">Multi-port identity</text>
    </g>
  <g>
      <rect x="482.4" y="252" width="193.2" height="28" rx="14" fill="rgba(96,165,250,0.15)" stroke="#93c5fd" stroke-opacity="0.45"/>
      <text x="495.4" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#60a5fa">SSE session stickiness</text>
    </g>
  <g>
      <rect x="687.5999999999999" y="252" width="140" height="28" rx="14" fill="rgba(96,165,250,0.15)" stroke="#93c5fd" stroke-opacity="0.45"/>
      <text x="700.5999999999999" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#60a5fa">Topology canvas</text>
    </g>
  <g>
      <rect x="839.5999999999999" y="252" width="124.8" height="28" rx="14" fill="rgba(96,165,250,0.15)" stroke="#93c5fd" stroke-opacity="0.45"/>
      <text x="852.5999999999999" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#60a5fa">Resin sidecar</text>
    </g>

  <!-- right diagram: ports -> resin-core -> Resin sidecar -> exits -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="905" y="118" width="130" height="52" rx="10" fill="#151b2e" stroke="rgba(255,255,255,0.12)"/>
    <text x="970" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#f1f5f9">resin-core</text>
    <text x="970" y="158" text-anchor="middle" font-size="11" fill="#94a3b8">shell (Rust)</text>

    <rect x="1070" y="118" width="100" height="52" rx="10" fill="#151b2e" stroke="rgba(255,255,255,0.12)"/>
    <text x="1120" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#f1f5f9">Resin</text>
    <text x="1120" y="158" text-anchor="middle" font-size="11" fill="#94a3b8">Go sidecar</text>

    <line x1="850" y1="144" x2="900" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
    <line x1="1035" y1="144" x2="1065" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

    <!-- exit nodes fanning out -->
    <g>
        <line x1="1120" y1="170" x2="1120" y2="218" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.3"/>
        <circle cx="1120" cy="236" r="12" fill="#151b2e" stroke="#a78bfa"/>
        <text x="1120" y="240" text-anchor="middle" font-size="10" fill="#a78bfa">IP1</text>
      </g>
  <g>
        <line x1="1120" y1="170" x2="1120" y2="260" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.3"/>
        <circle cx="1120" cy="278" r="12" fill="#151b2e" stroke="#a78bfa"/>
        <text x="1120" y="282" text-anchor="middle" font-size="10" fill="#a78bfa">IP2</text>
      </g>
  <g>
        <line x1="1120" y1="170" x2="1120" y2="302" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.3"/>
        <circle cx="1120" cy="320" r="12" fill="#151b2e" stroke="#a78bfa"/>
        <text x="1120" y="324" text-anchor="middle" font-size="10" fill="#a78bfa">IP3</text>
      </g>
    <text x="1120" y="356" text-anchor="middle" font-size="11" fill="#94a3b8">distinct sticky exit IPs</text>

    <!-- glow arc from ports to core -->
    <path d="M 225 150 C 420 60, 700 60, 895 130" fill="none" stroke="rgba(96,165,250,0.25)" stroke-width="2"/>
  </g>
</svg>