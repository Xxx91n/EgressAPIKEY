# Resin upstream version manifest (ADR-0017 T2-6).
# Single source of truth for the Resin Go sidecar version this shell bundles.
# fetch_resin.ps1 / .sh read the "version" + "repo" fields from this file.
# To upgrade: bump version, verify the release asset names match, test boot.
#
# Breaking changes between v1.1 and v1.2: endpoint API surface changes
# (allocation_policy enum, region_filters field, /nodes pagination).
# Compat notes (architecture-recovery ticket 11, 2026-08-30):
# - The shell consumes GET /api/v1/request-logs (ResinClient::request_logs,
#   src-tauri request_log_tail). Verified present in the v1.2.0 sidecar
#   (embedded WebUI + route strings in resin.exe). If a future Resin bump
#   removes or reshapes this endpoint, request_log_tail fails with an explicit
#   IpcError ("response has no items array") — that is the seam alarm, not a
#   silent misparse.
# - The shell no longer reads Resin's private request_logs*.db files (the
#   former direct-DB seam exception was closed by ticket 11).

repo: "Resinat/Resin"
version: "v1.2.0"
license: "MIT"
# Asset naming pattern: resin-<os>-<arch>.{zip|tar.gz}
# Windows: resin-windows-amd64.zip (contains resin.exe)
# macOS arm64: resin-darwin-arm64.tar.gz
# macOS amd64: resin-darwin-amd64.tar.gz
# Linux arm64: resin-linux-arm64.tar.gz
# Linux amd64: resin-linux-amd64.tar.gz
assets:
  windows-amd64: "resin-windows-amd64.zip"
  darwin-arm64: "resin-darwin-arm64.tar.gz"
  darwin-amd64: "resin-darwin-amd64.tar.gz"
  linux-arm64: "resin-linux-arm64.tar.gz"
  linux-amd64: "resin-linux-amd64.tar.gz"
