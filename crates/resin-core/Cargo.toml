[package]
name = "resin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shell-side support crate for EgressAPIKEY: loopback REST client for the Resin sidecar, whitebox config store, port forwarder/health, strategy engine, stream sensing, IP reputation, typed IPC errors"

[lib]
name = "resin_core"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hotswap-config = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
rusqlite = { workspace = true }
once_cell = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
# ADR-0070: backup-package AEAD (ChaCha20-Poly1305) + PBKDF2-HMAC-SHA256 key
# wrap. ring 0.17.14 is ALREADY in Cargo.lock (transitive via
# reqwest/rustls), so promoting it to a direct dependency adds no new crate to
# the tree - the same precedent as sha2/uuid below.
ring = "0.17"
# ADR-0059: audit log SHA-256 + uuid. Both are already in the
# workspace lockfile (transitive via reqwest/rustls), so this adds no new
# fetch; they become direct deps so audit.rs can hash rows and mint ids.
sha2 = { version = "0.10", default-features = false }
uuid = { version = "1", features = ["v4"] }
# Standard-alphabet base64 for the forwarder's Basic Proxy-Authorization
# header; 0.22.1 is already in Cargo.lock transitively.
base64 = "0.22"
# RFC 3986 percent-encoding for Resin path segments + query values; 2.3.2 is
# already in Cargo.lock transitively via the url/reqwest tree.
percent-encoding = "2.3"
# UTC calendar for audit.jsonl timestamps (replaces a hand-rolled
# civil-from-days). 0.4.45 is already in Cargo.lock transitively; alloc only,
# no clock - the caller passes epoch seconds.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# (tauri-specta pilot): optional, enabled only by the Tauri shell.
specta = { version = "=2.0.0-rc.25", optional = true }

[dev-dependencies]
mockito = "1"
# start_paused virtual time for deterministic rhythm tests.
tokio = { workspace = true, features = ["test-util"] }
[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
default = []
# TS type export for the IPC error contract. The Tauri shell
# (src-tauri) enables this so IpcError/PortMapping can enter bindings.ts;
# headless-only resin-core builds stay lean.
specta = ["dep:specta"]
