[package]
name = "resin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shell-side support crate for EgressAPIKEY: loopback REST client for the Resin sidecar, whitebox config store, port forwarder/health, strategy engine, stream sensing, IP reputation, typed IPC errors"

[lib]
name = "resin_core"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hotswap-config = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
rusqlite = { workspace = true }
once_cell = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
# Round 5 T11 / ADR-0059: audit log SHA-256 + uuid. Both are already in the
# workspace lockfile (transitive via reqwest/rustls), so this adds no new
# fetch; they become direct deps so audit.rs can hash rows and mint ids.
sha2 = { version = "0.10", default-features = false }
uuid = { version = "1", features = ["v4"] }
# Ticket 09 (tauri-specta pilot): optional, enabled only by the Tauri shell.
specta = { version = "=2.0.0-rc.25", optional = true }

[dev-dependencies]
mockito = "1"
# Ticket 20: start_paused virtual time for deterministic rhythm tests.
tokio = { workspace = true, features = ["test-util"] }
[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
default = []
# Ticket 09: TS type export for the IPC error contract. The Tauri shell
# (src-tauri) enables this so IpcError/PortMapping can enter bindings.ts;
# headless-only resin-core builds stay lean.
specta = ["dep:specta"]
