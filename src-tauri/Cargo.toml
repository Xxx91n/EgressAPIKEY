[package]
name = "egressapikey-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tauri 2 desktop shell for EgressAPIKEY"

[lib]
name = "egressapikey_app"
path = "src/lib.rs"

[[bin]]
name = "EgressAPIKEY"
path = "src/main.rs"

[[bin]]
name = "egressapikey-headless"
path = "src/bin/headless.rs"

[dependencies]
resin-core = { path = "../crates/resin-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing-appender = { workspace = true }
open = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }

# Tauri 2 desktop runtime + the plugin set the GUI uses. Versions pinned to
# the v2 line so cargo + npm agree on the JS @tauri-apps/* counterpart.
tauri = { version = "2", features = ["wry", "tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
# Single-instance guard (must be the FIRST plugin registered in main.rs):
# clicking a second GUI exe focuses the existing window instead of spawning a
# new process. Linux uses D-Bus, Windows/macOS native.
tauri-plugin-single-instance = "2"
# Structured logging via tauri-plugin-tracing: native `tracing` consumer
# with a WebviewLayer (Rust logs -> frontend log panel) + daily-rotating file
# appender to the OS log dir (Re7) + stdout. Replaces tauri-plugin-log so the
# whole codebase (resin-core + shell) uses one `tracing` pipeline (Re7/Re6).
tauri-plugin-tracing = "0.3"
parking_lot = { workspace = true }
once_cell = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "socks"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { workspace = true }
# Sidecar /health poll uses this loopback-only blocking client. Never
# exposed to the webview (AGENTS 7.6); admin token stays Rust-side.

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

# Tauri's generate_context! macro picks dev (devUrl) vs prod (embedded
# frontendDist) via cfg!(not(feature = "custom-protocol")). `tauri build`
# enables this feature automatically, but `cargo build` does NOT — so a plain
# `cargo build --release` would still set dev:true and the webview would try
# to load http://localhost:1420 (ERR_CONNECTION_REFUSED when no dev server
# runs). Forward the feature so our portable build path can opt in:
#   cargo build --release -p egressapikey-app --features custom-protocol
# build-all.sh / CI must pass --features custom-protocol for every GUI build
# that is handed to a user. See AGENTS.md section 5.
[features]
default = []
# Forwards to tauri's custom-protocol feature so generate_context! compiles
# the frontendDist assets into the binary (dev:false). Without this, any
# `cargo build` (including --release) leaves dev:true and the webview loads
# devUrl, which fails with ERR_CONNECTION_REFUSED on a user machine without
# the Vite dev server running.
custom-protocol = ["tauri/custom-protocol"]

# T14-1: Windows Job Object for sidecar orphan prevention (clash-verge-rev PR #6853 pattern).
# JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE ensures the OS kills resin.exe even if the
# GUI is force-terminated via Task Manager (RunEvent::Exit never fires).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
