[package]
name = "ai-api-route-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tauri 2 desktop shell for ai-api-route"

[lib]
name = "ai_api_route_app"
path = "src/lib.rs"

[[bin]]
name = "ai-api-route"
path = "src/main.rs"

[dependencies]
resin-core = { path = "../crates/resin-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Tauri 2 desktop runtime + the plugin set the GUI uses. Versions pinned to
# the v2 line so cargo + npm agree on the JS @tauri-apps/* counterpart.
tauri = { version = "2", features = ["wry", "tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
parking_lot = { workspace = true }
once_cell = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }
