name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: verify (build + test + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: verify-build
        run: bash scripts/verify-build.sh

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: backend headless (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build backend binary
        run: cargo build --release --target ${{ matrix.target }} -p resin-core
      - name: Package backend
        shell: bash
        run: |
          mkdir -p release
          STAGE="release/${{ matrix.name }}-backend"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/resin-core* "$STAGE/" 2>/dev/null || true
          cp Cargo.toml crates/resin-core/Cargo.toml "$STAGE/" 2>/dev/null || true
          cp -r docs "$STAGE/docs" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-backend
          path: release/${{ matrix.name }}-backend.tar.gz
          if-no-files-found: error

  gui:
    name: gui (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: "--target x86_64-unknown-linux-gnu"
            name: linux-gui
          - os: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            name: windows-gui
          - os: macos-latest
            args: "--target universal-apple-darwin"
            name: macos-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'universal') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "ai-api-route ${{ github.ref_name }}"
          releaseBody: "See docs/ for build instructions. Artifacts: Windows GUI, Linux/debian GUI, macOS GUI, plus per-OS headless backend tarballs."
          releaseDraft: true
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            src-tauri/target/*/release/bundle/
            src-tauri/target/release/bundle/
          if-no-files-found: warn
