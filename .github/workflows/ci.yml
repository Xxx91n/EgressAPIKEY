name: ci

# Dual trigger (release strategy: verify automatic on push/PR, release jobs manual-dispatch).
# push / pull_request -> ONLY the `verify` job runs: cargo test + frontend build
# (tsc + vite) + vitest + every guard script (scripts/verify-build.sh) + the
# line-ending guard. This is the push->verify gate: no green verify, no merge.
# workflow_dispatch -> `verify` + `macos-test` (tier-2
# release gate) + the release matrix (`e2e` / `backend` / `gui` / `gui-portable`)
# + `release-assets` (verifies portable/backend contents and attaches them +
# SHA256SUMS.txt to the draft GitHub Release), still manual: the user opens the
# Actions tab and types a tag. Input `prerelease` marks beta/test releases;
# `include_intel_mac` (default off) additionally gates the two opt-in
# macOS x86_64 legs (backend-intel + gui-intel on macos-15-intel).
# Release packaging NEVER runs on push: every release/e2e job carries
# `if: github.event_name == 'workflow_dispatch'`.
# Minute burn is bounded by the concurrency group below: superseded push/PR runs on
# the same ref are cancelled, while a manual release run is never cancelled.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (e.g. v0.2.1). The user runs: git tag <tag> && git push origin <tag> first, then triggers this workflow with the same tag.'
        required: true
        type: string
      prerelease:
        description: 'Mark the draft GitHub Release as a pre-release (beta / test release)'
        required: false
        type: boolean
        default: false
      # macOS x86_64 demoted to opt-in best-effort (release-strategy revision)
      # - macos-13 was retired wholesale (2025-12-04/08) so the legs moved to
      # macos-15-intel, the last Intel image (retires 2027-08). Default off:
      # non-Intel legs always build; Intel legs need this input on.
      include_intel_mac:
        description: 'Also build the macOS x86_64 (Intel) legs on macos-15-intel - opt-in best-effort until 2027-08'
        required: false
        type: boolean
        default: false

# Cancel superseded push/PR runs on the same ref. A manual release run is never
# cancelled, so an intentional release always finishes even if a push lands mid-run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
 # 1. push->verify gate: the ONLY job that runs on push
  # and pull_request. cargo test + frontend build (tsc + vite) + vitest + every
  # guard script + the line-ending guard. Guard scripts are enumerated in
  # scripts/verify-build.sh (i18n x18 / vitest-isolation /
  # license-field / mode-a-contract).
  verify:
    name: 'verify (push->verify gate: build + test + i18n + guards)'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: checkout release tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: checkout pushed/PR ref
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch_resin.sh
      - name: verify-build (cargo build+test, tsc, vite, vitest, i18n)
        run: bash scripts/verify-build.sh
      - name: line-ending guard
        run: git diff --check || (echo "::error::CRLF/whitespace errors detected" && exit 1)

  # 1b. macOS tier-2 test gate: cargo test on macos-latest
  # as a REQUIRED check on the release path - gate-at-release here, while
  # the periodic signal lives in bench.yml's macos-latest leg
  # (signal-at-main). Dispatch-only: NEVER on push (~10x runner cost +
  # flake surface would press the only merge gate - CI-only-delivery noise
  # discipline). A first macOS-unique failure fires the armed register
  # row (promotion-to-gating adjudication).
  macos-test:
    name: 'macos cargo test (tier-2 release gate)'
    runs-on: macos-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch Resin Go sidecar binary
        shell: bash
        run: bash scripts/fetch_resin.sh
      # Same test scope as the unix verify leg. The repo .cargo/config.toml
      # pins x86_64-pc-windows-msvc, so CARGO_BUILD_TARGET must be overridden
      # to the host triple (same trick as the verify job on ubuntu).
      - name: cargo test (tier-2 signal promoted to release gate)
        run: |
          cargo test -p resin-core --quiet
          cargo test -p egressapikey-app --lib --quiet

  # 2. Frontend e2e (playwright) on the Vite dev server surface.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: [verify, macos-test]
    # Release-track job: never on push - the automatic gate is `verify` only.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# 3. Headless backend matrix: egressapikey-headless binary + dist/ + resin sidecar,
# self-contained release for users who want the proxy without the GUI shell.
  backend:
    name: backend headless (${{ matrix.name }})
    needs: [verify, macos-test]
    # Release-track job: manual dispatch only (release strategy Track 2).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: install Linux native deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: server-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tauri build script validates externalBin resources at BUILD time
      # (binaries/resin-* must exist before cargo runs) and generate_context!
      # embeds frontendDist, so both prerequisites precede the compile.
      - name: fetch Resin Go sidecar binary
        shell: bash
        run: bash scripts/fetch_resin.sh
      - run: pnpm build
      - name: Build backend binary
        run: cargo build --release --target ${{ matrix.target }} -p egressapikey-app --bin egressapikey-headless --features headless
      - name: Package backend
        shell: bash
        run: |
          set -e
          mkdir -p release
          STAGE="release/${{ matrix.name }}-backend"
          mkdir -p "$STAGE"
          # Copy headless binary (with or without .exe suffix)
          cp "target/${{ matrix.target }}/release/egressapikey-headless" "$STAGE/" 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/egressapikey-headless.exe" "$STAGE/" 2>/dev/null || {
              echo "::error::headless binary not found"; exit 1; }
          # Copy dist/ (frontend static assets)
          cp -r dist "$STAGE/dist"
          # Copy resin sidecar
          TRIPLE="${{ matrix.target }}"
          SIDECAR_BIN="$(ls src-tauri/binaries/resin-*${TRIPLE}* 2>/dev/null | head -1 || true)"
          if [ -n "$SIDECAR_BIN" ]; then
            cp "$SIDECAR_BIN" "$STAGE/resin${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          else
            echo "::error::resin sidecar not found — headless will fail to boot resin"
            exit 1
          fi
          # Include docs
          cp -r docs "$STAGE/docs" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -lh "$STAGE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-backend
          path: release/${{ matrix.name }}-backend.tar.gz
          if-no-files-found: error

  # 3b. Opt-in Intel backend leg: same shape as a backend matrix leg
  # but gated on the include_intel_mac dispatch input - a job-level `if`
  # keeps the opt-out path from even provisioning an Intel runner.
  backend-intel:
    name: backend headless (macos-x86_64, opt-in)
    needs: [verify, macos-test]
    if: github.event_name == 'workflow_dispatch' && inputs.include_intel_mac
    # Raised bound: Intel runners are empirically slow.
    timeout-minutes: 120
    runs-on: macos-15-intel
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: server-${{ env.TARGET }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary
        shell: bash
        run: bash scripts/fetch_resin.sh
      - run: pnpm build
      - name: Build backend binary
        run: cargo build --release --target ${{ env.TARGET }} -p egressapikey-app --bin egressapikey-headless --features headless
      - name: Package backend
        shell: bash
        run: |
          set -e
          mkdir -p release
          STAGE="release/macos-x86_64-backend"
          mkdir -p "$STAGE"
          cp "target/${{ env.TARGET }}/release/egressapikey-headless" "$STAGE/"
          cp -r dist "$STAGE/dist"
          SIDECAR_BIN="$(ls src-tauri/binaries/resin-*${{ env.TARGET }}* 2>/dev/null | head -1 || true)"
          if [ -n "$SIDECAR_BIN" ]; then
            cp "$SIDECAR_BIN" "$STAGE/resin"
          else
            echo "::error::resin sidecar not found — headless will fail to boot resin"
            exit 1
          fi
          cp -r docs "$STAGE/docs" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -lh "$STAGE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-backend
          path: release/macos-x86_64-backend.tar.gz
          if-no-files-found: error

  # 4. GUI installer matrix: tauri-action produces per-OS installer bundles.
  # Windows -> msi + nsis setup.exe; Linux -> deb + AppImage; macOS -> dmg (universal).
  gui:
    name: gui installer (${{ matrix.name }})
    needs: [verify, macos-test]
    # Release-track job: manual dispatch only (release strategy Track 2).
    if: github.event_name == 'workflow_dispatch'
    # tauri-action creates the draft GitHub release + uploads installer
    # assets (releaseName/tagName below) — the default token is read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-gui
            ubuntuDeps: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-gui
            ubuntuDeps: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-gui-arm64
            ubuntuDeps: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: install Linux native deps
        if: matrix.ubuntuDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary (windows powershell / unix bash)
        shell: bash
        run: bash scripts/fetch_resin.sh
      - name: tauri build (installer bundles)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # custom-protocol MUST be passed: without it tauri::generate_context!
          # compiles dev:true → webview loads devUrl (localhost:1420) →
          # ERR_CONNECTION_REFUSED on the user's machine (no Vite dev server).
          # See AGENTS.md section 5 + src-tauri/Cargo.toml [features].
          args: --target ${{ matrix.target }} --features custom-protocol
          tagName: ${{ inputs.tag }}
          releaseName: "EgressAPIKEY ${{ inputs.tag }}"
          releaseBody: "Windows MSI+NSIS setup + portable zip, Linux deb+AppImage + portable tar.gz, macOS dmg + portable tar.gz (arm64; x86_64 dmg/backend opt-in via include_intel_mac), per-OS headless backend tarballs, and SHA256SUMS.txt."
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
      - name: stage release/
        shell: bash
        run: |
          set -e
          STAGE="release/${{ matrix.name }}"
          mkdir -p "$STAGE"
          # Cargo workspace emits to the ROOT target/ dir (src-tauri is a
          # workspace member, not a workspace root) — search both roots.
          # find exits non-zero on missing dirs (pipefail) — filter first.
          for d in "target/${{ matrix.target }}/release/bundle" \
                   "src-tauri/target/${{ matrix.target }}/release/bundle" \
                   "target/release/bundle" \
                   "src-tauri/target/release/bundle"; do
            [ -d "$d" ] || continue
            find "$d" -type f \(\
              -name '*.msi' -o -name '*-setup.exe' -o \
              -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
              -print | while read -r f; do
              cp "$f" "$STAGE/"
            done
          done
          [ "$(ls -A "$STAGE" 2>/dev/null)" ] || { echo "::error::no installer bundles staged"; exit 1; }
          ls -lh "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: release/${{ matrix.name }}/*
          if-no-files-found: error

  # 4b. Opt-in Intel GUI installer leg: the macos-13 -> macos-15-intel
  # migration gated on include_intel_mac; same tauri-action shape as a gui
  # matrix leg so its dmg lands on the same draft release when opted in.
  gui-intel:
    name: gui installer (macos-gui-x86_64, opt-in)
    needs: [verify, macos-test]
    if: github.event_name == 'workflow_dispatch' && inputs.include_intel_mac
    # Raised bound: Intel-runner tauri builds are empirically the slowest leg.
    timeout-minutes: 180
    permissions:
      contents: write
    runs-on: macos-15-intel
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary (windows powershell / unix bash)
        shell: bash
        run: bash scripts/fetch_resin.sh
      - name: tauri build (installer bundles)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # custom-protocol MUST be passed: without it tauri::generate_context!
          # compiles dev:true → webview loads devUrl (localhost:1420) →
          # ERR_CONNECTION_REFUSED on the user's machine (no Vite dev server).
          # See AGENTS.md section 5 + src-tauri/Cargo.toml [features].
          args: --target ${{ env.TARGET }} --features custom-protocol
          tagName: ${{ inputs.tag }}
          releaseName: "EgressAPIKEY ${{ inputs.tag }}"
          releaseBody: "Windows MSI+NSIS setup + portable zip, Linux deb+AppImage + portable tar.gz, macOS dmg + portable tar.gz (arm64; x86_64 dmg/backend opt-in via include_intel_mac), per-OS headless backend tarballs, and SHA256SUMS.txt."
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
      - name: stage release/
        shell: bash
        run: |
          set -e
          STAGE="release/macos-gui-x86_64"
          mkdir -p "$STAGE"
          for d in "target/${{ env.TARGET }}/release/bundle" \
                   "src-tauri/target/${{ env.TARGET }}/release/bundle" \
                   "target/release/bundle" \
                   "src-tauri/target/release/bundle"; do
            [ -d "$d" ] || continue
            find "$d" -type f -name '*.dmg' -print | while read -r f; do
              cp "$f" "$STAGE/"
            done
          done
          [ "$(ls -A "$STAGE" 2>/dev/null)" ] || { echo "::error::no installer bundles staged"; exit 1; }
          ls -lh "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-gui-x86_64-installers
          path: release/macos-gui-x86_64/*
          if-no-files-found: error

  # 5. Portable GUI binary matrix: a single uninstalled GUI executable per
  # OS for users who want to run without an installer. Comes from Tauri
  # v2's `--no-bundle` build mode.
  gui-portable:
    name: gui portable (${{ matrix.name }})
    needs: [verify, macos-test]
    # Release-track job: manual dispatch only (release strategy Track 2).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-gui-portable
            ubuntuDeps: true
            bin: EgressAPIKEY
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-gui-portable
            ubuntuDeps: false
            bin: EgressAPIKEY.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-gui-portable-arm64
            ubuntuDeps: false
            bin: EgressAPIKEY
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: install Linux native deps
        if: matrix.ubuntuDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary (windows powershell / unix bash)
        shell: bash
        run: bash scripts/fetch_resin.sh
      - name: tauri build --no-bundle (portable binary)
        # custom-protocol MUST be passed (see installer job comment above).
        run: npx --no-install tauri build --no-bundle --features custom-protocol --target ${{ matrix.target }}
      - name: stage release/
        shell: bash
        run: |
          set -e
          STAGE="release/${{ matrix.name }}"
          mkdir -p "$STAGE"
          # Cargo workspace emits to the ROOT target/ dir — search it first,
          # then the legacy src-tauri/target/ path, and fail loudly if absent.
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || \
            cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || \
            cp "target/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || \
            cp "src-tauri/target/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || {
              echo "::error::portable binary not found"; exit 1; }
          # The app resolves the Resin sidecar next to the app binary (exe dir)
          # under its externalBin name — ship it beside the portable exe.
          TRIPLE="${{ matrix.target }}"
          SIDECAR_BIN="$(ls src-tauri/binaries/resin-*${TRIPLE}* 2>/dev/null | head -1 || true)"
          if [ -n "$SIDECAR_BIN" ]; then
            cp "$SIDECAR_BIN" "$STAGE/resin${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          else
            echo "::error::resin sidecar not found — portable app cannot boot resin"
            exit 1
          fi
          ls -lh "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.name }}/*
          if-no-files-found: error

  # 6. Release asset verification & draft-release attachment:
  # tauri-action in `gui` / `gui-intel` creates the draft GitHub Release and
  # uploads installer bundles (.msi / -setup.exe / .deb / .AppImage / .dmg).
  # This fan-in job verifies version alignment + portable/backend package
  # completeness (app binary + Resin sidecar + dist/), packages the per-OS
  # portable archives, generates SHA256SUMS.txt, and attaches them all to the
  # same draft release while enforcing the requested `prerelease` flag.
  release-assets:
    name: release assets (verify + attach portable & backend)
    runs-on: ubuntu-latest
    needs: [gui, gui-intel, gui-portable, backend, backend-intel]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.gui.result == 'success' &&
      needs['gui-portable'].result == 'success' &&
      needs.backend.result == 'success' &&
      (needs['gui-intel'].result == 'success' || needs['gui-intel'].result == 'skipped') &&
      (needs['backend-intel'].result == 'success' || needs['backend-intel'].result == 'skipped')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      INCLUDE_INTEL_MAC: ${{ inputs.include_intel_mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: verify manifests & stage portable and backend archives
        shell: bash
        run: |
          set -euo pipefail

          # 1. Verify all four manifests agree on the version string, and when
          # RELEASE_TAG is a semver tag (vX.Y.Z...), require it to match.
          PKG_VER="$(jq -r '.version' package.json)"
          TAURI_VER="$(jq -r '.version' src-tauri/tauri.conf.json)"
          NPM_SRV_VER="$(jq -r '.version' scripts/npm/package.json)"
          CARGO_VER="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' Cargo.toml | head -n1)"

          if [ -z "$PKG_VER" ] || [ "$PKG_VER" != "$TAURI_VER" ] || [ "$PKG_VER" != "$NPM_SRV_VER" ] || [ "$PKG_VER" != "$CARGO_VER" ]; then
            echo "::error::manifest version mismatch: package.json=$PKG_VER tauri.conf.json=$TAURI_VER scripts/npm/package.json=$NPM_SRV_VER Cargo.toml=$CARGO_VER"
            exit 1
          fi
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            TAG_BASE="${BASH_REMATCH[1]}"
            if [ "$TAG_BASE" != "$PKG_VER" ]; then
              echo "::error::release tag $RELEASE_TAG disagrees with manifest version $PKG_VER"
              exit 1
            fi
          fi
          echo "Manifest version verified: $PKG_VER (tag: $RELEASE_TAG)"

          mkdir -p dist-release

          # Helper: file must exist and exceed 1 MB (guards against truncated binaries).
          require_min_1mb() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "::error::missing expected binary: $f"
              exit 1
            fi
            local sz
            sz="$(wc -c < "$f")"
            if [ "$sz" -lt 1000000 ]; then
              echo "::error::binary unexpectedly small ($sz bytes): $f"
              exit 1
            fi
          }

          # 2. Verify & archive portable GUI bundles (app binary + Resin sidecar).
          require_min_1mb "release-artifacts/windows-gui-portable/EgressAPIKEY.exe"
          require_min_1mb "release-artifacts/windows-gui-portable/resin.exe"
          (cd release-artifacts && zip -rq "../dist-release/windows-gui-portable.zip" "windows-gui-portable")

          require_min_1mb "release-artifacts/linux-gui-portable/EgressAPIKEY"
          require_min_1mb "release-artifacts/linux-gui-portable/resin"
          chmod 0755 "release-artifacts/linux-gui-portable/EgressAPIKEY" "release-artifacts/linux-gui-portable/resin"
          tar -C release-artifacts -czf "dist-release/linux-gui-portable.tar.gz" "linux-gui-portable"

          require_min_1mb "release-artifacts/macos-gui-portable-arm64/EgressAPIKEY"
          require_min_1mb "release-artifacts/macos-gui-portable-arm64/resin"
          chmod 0755 "release-artifacts/macos-gui-portable-arm64/EgressAPIKEY" "release-artifacts/macos-gui-portable-arm64/resin"
          tar -C release-artifacts -czf "dist-release/macos-gui-portable-arm64.tar.gz" "macos-gui-portable-arm64"

          # 3. Verify & stage headless backend tarballs (headless bin + sidecar + dist/index.html).
          BACKENDS=("linux-backend" "windows-backend" "macos-arm64-backend")
          if [ "$INCLUDE_INTEL_MAC" = "true" ]; then
            BACKENDS+=("macos-x86_64-backend")
          fi
          for b in "${BACKENDS[@]}"; do
            TAR_PATH="release-artifacts/${b}/${b}.tar.gz"
            if [ ! -s "$TAR_PATH" ]; then
              echo "::error::missing backend archive: $TAR_PATH"
              exit 1
            fi
            LISTING="$(tar -tzf "$TAR_PATH")"
            grep -Eq '/egressapikey-headless(\.exe)?$' <<<"$LISTING" || {
              echo "::error::$TAR_PATH missing egressapikey-headless binary"; exit 1; }
            grep -Eq '/resin(\.exe)?$' <<<"$LISTING" || {
              echo "::error::$TAR_PATH missing resin sidecar binary"; exit 1; }
            grep -Eq '/dist/index\.html$' <<<"$LISTING" || {
              echo "::error::$TAR_PATH missing dist/index.html"; exit 1; }
            cp "$TAR_PATH" "dist-release/${b}.tar.gz"
          done

          # 4. Verify staged installer artifact directories are present and non-empty.
          INSTALLER_DIRS=("linux-gui-installers" "windows-gui-installers" "macos-gui-arm64-installers")
          if [ "$INCLUDE_INTEL_MAC" = "true" ]; then
            INSTALLER_DIRS+=("macos-gui-x86_64-installers")
          fi
          for d in "${INSTALLER_DIRS[@]}"; do
            if [ ! -d "release-artifacts/$d" ] || [ -z "$(ls -A "release-artifacts/$d" 2>/dev/null)" ]; then
              echo "::error::missing or empty installer artifact dir $d"
              exit 1
            fi
          done
          ls -lh dist-release

      - name: attach portable, backend & SHA256SUMS to draft GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          # Draft releases return 404 on /releases/tags/<tag>; list draft
          # releases and match `.tag_name` directly (never mutate an already
          # published release).
          REL_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            | jq -rs --arg tag "$RELEASE_TAG" '(add // []) | [.[] | select(.draft == true and .tag_name == $tag)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$REL_ID" ]; then
            echo "::error::draft release for tag '$RELEASE_TAG' not found"
            exit 1
          fi
          echo "Resolved GitHub Release ID: $REL_ID (tag: $RELEASE_TAG, prerelease: $PRERELEASE)"

          # Enforce draft=true and the requested prerelease boolean on the release.
          if [ "$PRERELEASE" = "true" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" -F draft=true -F prerelease=true >/dev/null
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" -F draft=true -F prerelease=false >/dev/null
          fi

          EXISTING_JSON="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets" | jq -cs 'add // []')"
          for f in dist-release/*; do
            fname="$(basename "$f")"
            EXISTING_ID="$(jq -r --arg n "$fname" '.[] | select(.name == $n) | .id // empty' <<<"$EXISTING_JSON" | head -n1)"
            if [ -n "$EXISTING_ID" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${EXISTING_ID}"
            fi
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?name=${fname}" >/dev/null
            echo "Uploaded $fname"
          done

          # Reconcile SHA256SUMS.txt against EVERY non-checksum asset present on
          # the Draft Release (covers tauri-action bundles such as *.app.tar.gz
          # and any retained draft installer assets alongside dist-release/*).
          rm -rf checksum-inputs
          mkdir -p checksum-inputs
          cp dist-release/* checksum-inputs/
          LIVE_ASSETS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets" | jq -cs 'add // []')"
          while IFS= read -r -d '' aname && IFS= read -r -d '' aurl; do
            if [[ -z "$aname" || "$aname" == *"/"* || "$aname" == *"\\"* || "$aname" == *$'\n'* || "$aname" == "." || "$aname" == ".." || "$aname" == -* ]]; then
              echo "::error::unsafe release asset filename: $aname"
              exit 1
            fi
            if [ ! -f "checksum-inputs/$aname" ]; then
              curl < /dev/null --fail-with-body -sSL --retry 3 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                "$aurl" -o "checksum-inputs/$aname"
            fi
          done < <(jq -j '.[] | select(.name != "SHA256SUMS.txt") | .name, "\u0000", .url, "\u0000"' <<<"$LIVE_ASSETS")

          (cd checksum-inputs && sha256sum -- * | LC_ALL=C sort -k2 > "../SHA256SUMS.txt")
          cat SHA256SUMS.txt

          EXISTING_SUM_ID="$(jq -r '.[] | select(.name == "SHA256SUMS.txt") | .id // empty' <<<"$LIVE_ASSETS" | head -n1)"
          if [ -n "$EXISTING_SUM_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${EXISTING_SUM_ID}"
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"SHA256SUMS.txt" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?name=SHA256SUMS.txt" >/dev/null
          echo "Uploaded SHA256SUMS.txt"

          # Final completeness & 1:1 checksum coverage gate against the live Draft Release.
          FINAL_REL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}")"
          ASSET_NAMES="$(jq -r '.assets[].name' <<<"$FINAL_REL")"
          for pattern in \
            '\.msi$' \
            '-setup\.exe$' \
            '\.deb$' \
            '\.AppImage$' \
            '_aarch64\.dmg$' \
            '^windows-gui-portable\.zip$' \
            '^linux-gui-portable\.tar\.gz$' \
            '^macos-gui-portable-arm64\.tar\.gz$' \
            '^linux-backend\.tar\.gz$' \
            '^windows-backend\.tar\.gz$' \
            '^macos-arm64-backend\.tar\.gz$' \
            '^SHA256SUMS\.txt$'; do
            grep -Eq "$pattern" <<<"$ASSET_NAMES" || {
              echo "::error::draft release $REL_ID missing asset matching $pattern"
              exit 1
            }
          done
          if [ "$INCLUDE_INTEL_MAC" = "true" ]; then
            for pattern in '_x64\.dmg$' '^macos-x86_64-backend\.tar\.gz$'; do
              grep -Eq "$pattern" <<<"$ASSET_NAMES" || {
                echo "::error::draft release $REL_ID missing Intel macOS asset matching $pattern"
                exit 1
              }
            done
          fi

          EXPECTED_SUM_NAMES="$(jq -r '.assets[].name | select(. != "SHA256SUMS.txt")' <<<"$FINAL_REL" | LC_ALL=C sort)"
          ACTUAL_SUM_NAMES="$(sed 's/^[0-9a-f]\{64\} [ *]//' SHA256SUMS.txt | LC_ALL=C sort)"
          if [ "$EXPECTED_SUM_NAMES" != "$ACTUAL_SUM_NAMES" ]; then
            echo "::error::SHA256SUMS.txt entries disagree with Draft Release asset list"
            exit 1
          fi

          {
            echo "## Draft Release Verified (\`${RELEASE_TAG}\`)"
            echo ""
            echo "- **Release ID**: \`${REL_ID}\`"
            echo "- **Draft**: \`$(jq -r '.draft' <<<"$FINAL_REL")\`"
            echo "- **Pre-release**: \`$(jq -r '.prerelease' <<<"$FINAL_REL")\`"
            echo ""
            echo "| Asset | Size (bytes) | Digest |"
            echo "| --- | ---: | --- |"
            jq -r '.assets | sort_by(.name)[] | "| `\(.name)` | \(.size) | `\(.digest // "—")` |"' <<<"$FINAL_REL"
          } >> "$GITHUB_STEP_SUMMARY"
