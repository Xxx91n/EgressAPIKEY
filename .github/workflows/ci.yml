name: ci

# Manual dispatch only (ADR-0010): the user triggers the 5-job release matrix
# from the Actions tab with a tag input. Pushes and PRs do NOT auto-run — the
# local scripts/build-all.sh covers the per-commit release-exe requirement
# (AGENTS.md section 5), and CI minutes are spent only on intentional releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (e.g. v0.1.0). The user runs: git tag <tag> && git push origin <tag> first, then triggers this workflow with the same tag.'
        required: true
        type: string

jobs:
  # 1. Lint + typecheck + build + unit tests + i18n coverage gate.
  verify:
    name: verify (build + test + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: verify-build (cargo build+test, tsc, vite, vitest, i18n)
        run: bash scripts/verify-build.sh
      - name: line-ending guard
        run: git diff --check || (echo "::error::CRLF/whitespace errors detected" && exit 1)

  # 2. Frontend e2e (playwright) on the Vite dev server surface.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 3. Headless backend matrix: resin-core per-OS binary + docs tarball,
  #    used by users who only want the proxy without the GUI shell.
  backend:
    name: backend headless (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Build backend binary
        run: cargo build --release --target ${{ matrix.target }} -p resin-core
      - name: Package backend
        shell: bash
        run: |
          set -e
          mkdir -p release
          STAGE="release/${{ matrix.name }}-backend"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/resin-core" "$STAGE/" 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/resin-core.exe" "$STAGE/" 2>/dev/null || true
          cp -r docs "$STAGE/docs" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -lh "$STAGE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-backend
          path: release/${{ matrix.name }}-backend.tar.gz
          if-no-files-found: error

  # 4. GUI installer matrix: tauri-action produces per-OS installer bundles.
  #    Windows -> msi + nsis setup.exe; Linux -> deb + AppImage; macOS -> dmg (universal).
  gui:
    name: gui installer (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-gui
            ubuntuDeps: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-gui
            ubuntuDeps: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-gui-arm64
            ubuntuDeps: false
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-gui-x86_64
            ubuntuDeps: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: install Linux native deps
        if: matrix.ubuntuDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary (windows powershell / unix bash)
        shell: bash
        run: bash scripts/fetch_resin.sh
      - name: tauri build (installer bundles)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # custom-protocol MUST be passed: without it tauri::generate_context!
          # compiles dev:true → webview loads devUrl (localhost:1420) →
          # ERR_CONNECTION_REFUSED on the user's machine (no Vite dev server).
          # See AGENTS.md section 5 + src-tauri/Cargo.toml [features].
          args: --target ${{ matrix.target }} --features custom-protocol
          tagName: ${{ inputs.tag }}
          releaseName: "EgressAPIKEY ${{ inputs.tag }}"
          releaseBody: "Windows MSI+NSIS setup, Linux deb+AppImage, macOS dmg (arm64 + x86_64), plus per-OS headless backend tarballs."
          releaseDraft: true
          prerelease: false
      - name: stage release/
        shell: bash
        run: |
          set -e
          STAGE="release/${{ matrix.name }}"
          mkdir -p "$STAGE"
          find "src-tauri/target/${{ matrix.target }}/release/bundle" \
               src-tauri/target/release/bundle \
               -type f \( \
            -name '*.msi' -o -name '*-setup.exe' -o \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
               -print 2>/dev/null | while read -r f; do
            cp "$f" "$STAGE/"
          done
          ls -lh "$STAGE" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: release/${{ matrix.name }}/*
          if-no-files-found: error

  # 5. Portable GUI binary matrix: a single uninstalled GUI executable per
  #    OS for users who want to run without an installer. Comes from Tauri
  #    v2's `--no-bundle` build mode.
  gui-portable:
    name: gui portable (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-gui-portable
            ubuntuDeps: true
            bin: EgressAPIKEY
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-gui-portable
            ubuntuDeps: false
            bin: EgressAPIKEY.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-gui-portable-arm64
            ubuntuDeps: false
            bin: EgressAPIKEY
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: install Linux native deps
        if: matrix.ubuntuDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary (windows powershell / unix bash)
        shell: bash
        run: bash scripts/fetch_resin.sh
      - name: tauri build --no-bundle (portable binary)
        # custom-protocol MUST be passed (see installer job comment above).
        run: npx --no-install tauri build --no-bundle --features custom-protocol --target ${{ matrix.target }}
      - name: stage release/
        shell: bash
        run: |
          set -e
          STAGE="release/${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || \
            cp "src-tauri/target/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || true
          ls -lh "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.name }}/*
          if-no-files-found: error
