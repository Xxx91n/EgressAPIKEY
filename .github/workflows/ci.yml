name: ci

# Dual trigger (ADR-0010 + its 2026-09-14 revision note; round-8 ticket 06 / A-016).
#   push / pull_request -> ONLY the `verify` job runs: cargo test + frontend build
#     (tsc + vite) + vitest + every guard script (scripts/verify-build.sh) + the
#     line-ending guard. This is the push->verify gate: no green verify, no merge.
#   workflow_dispatch  -> `verify` + the 5-job release matrix, unchanged and still
#     manual: the user opens the Actions tab and types a tag.
# Release packaging NEVER runs on push: every release/e2e job carries
# `if: github.event_name == 'workflow_dispatch'`.
# Minute burn is bounded by the concurrency group below: superseded push/PR runs on
# the same ref are cancelled, while a manual release run is never cancelled.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (e.g. v0.1.0). The user runs: git tag <tag> && git push origin <tag> first, then triggers this workflow with the same tag.'
        required: true
        type: string

# Cancel superseded push/PR runs on the same ref. A manual release run is never
# cancelled, so an intentional release always finishes even if a push lands mid-run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # 1. push->verify gate (round-8 ticket 06 / A-016): the ONLY job that runs on push
  #    and pull_request. cargo test + frontend build (tsc + vite) + vitest + every
  #    guard script + the line-ending guard. Guard scripts are enumerated in
  #    scripts/verify-build.sh (i18n x18 / ipc-manifest / vitest-isolation /
  #    license-field / readme-lang / upstream-router).
  verify:
    name: 'verify (push->verify gate: build + test + i18n + guards)'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: checkout release tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: checkout pushed/PR ref
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch_resin.sh
      - name: verify-build (cargo build+test, tsc, vite, vitest, i18n)
        run: bash scripts/verify-build.sh
      - name: line-ending guard
        run: git diff --check || (echo "::error::CRLF/whitespace errors detected" && exit 1)

  # 2. Frontend e2e (playwright) on the Vite dev server surface.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: verify
    # Release-track job: never on push - the automatic gate is `verify` only.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# 3. Headless backend matrix: egressapikey-headless binary + dist/ + resin sidecar,
#    self-contained release for users who want the proxy without the GUI shell.
  backend:
    name: backend headless (${{ matrix.name }})
    needs: verify
    # Release-track job: manual dispatch only (ADR-0010 Track 2).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: server-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Build backend binary
        run: cargo build --release --target ${{ matrix.target }} -p egressapikey-app --bin egressapikey-headless --features headless
      - name: Package backend
        shell: bash
        run: |
          set -e
          # Fetch resin sidecar binary (headless stage is self-contained)
          bash scripts/fetch_resin.sh
          # Install deps + build frontend dist (headless serves the SPA)
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p release
          STAGE="release/${{ matrix.name }}-backend"
          mkdir -p "$STAGE"
          # Copy headless binary (with or without .exe suffix)
          cp "target/${{ matrix.target }}/release/egressapikey-headless" "$STAGE/" 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/egressapikey-headless.exe" "$STAGE/" 2>/dev/null || {
              echo "::error::headless binary not found"; exit 1; }
          # Copy dist/ (frontend static assets)
          cp -r dist "$STAGE/dist"
          # Copy resin sidecar
          TRIPLE="${{ matrix.target }}"
          SIDECAR_BIN="$(ls src-tauri/binaries/resin-*${TRIPLE}* 2>/dev/null | head -1 || true)"
          if [ -n "$SIDECAR_BIN" ]; then
            cp "$SIDECAR_BIN" "$STAGE/resin${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          else
            echo "::warning::resin sidecar not found — headless will fail to boot resin"
          fi
          # Include docs
          cp -r docs "$STAGE/docs" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          ls -lh "$STAGE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-backend
          path: release/${{ matrix.name }}-backend.tar.gz
          if-no-files-found: error

  # 4. GUI installer matrix: tauri-action produces per-OS installer bundles.
  #    Windows -> msi + nsis setup.exe; Linux -> deb + AppImage; macOS -> dmg (universal).
  gui:
    name: gui installer (${{ matrix.name }})
    needs: verify
    # Release-track job: manual dispatch only (ADR-0010 Track 2).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-gui
            ubuntuDeps: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-gui
            ubuntuDeps: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-gui-arm64
            ubuntuDeps: false
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-gui-x86_64
            ubuntuDeps: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: install Linux native deps
        if: matrix.ubuntuDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary (windows powershell / unix bash)
        shell: bash
        run: bash scripts/fetch_resin.sh
      - name: tauri build (installer bundles)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # custom-protocol MUST be passed: without it tauri::generate_context!
          # compiles dev:true → webview loads devUrl (localhost:1420) →
          # ERR_CONNECTION_REFUSED on the user's machine (no Vite dev server).
          # See AGENTS.md section 5 + src-tauri/Cargo.toml [features].
          args: --target ${{ matrix.target }} --features custom-protocol
          tagName: ${{ inputs.tag }}
          releaseName: "EgressAPIKEY ${{ inputs.tag }}"
          releaseBody: "Windows MSI+NSIS setup, Linux deb+AppImage, macOS dmg (arm64 + x86_64), plus per-OS headless backend tarballs."
          releaseDraft: true
          prerelease: false
      - name: stage release/
        shell: bash
        run: |
          set -e
          STAGE="release/${{ matrix.name }}"
          mkdir -p "$STAGE"
          find "src-tauri/target/${{ matrix.target }}/release/bundle" \
               src-tauri/target/release/bundle \
               -type f \( \
            -name '*.msi' -o -name '*-setup.exe' -o \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
               -print 2>/dev/null | while read -r f; do
            cp "$f" "$STAGE/"
          done
          ls -lh "$STAGE" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: release/${{ matrix.name }}/*
          if-no-files-found: error

  # 5. Portable GUI binary matrix: a single uninstalled GUI executable per
  #    OS for users who want to run without an installer. Comes from Tauri
  #    v2's `--no-bundle` build mode.
  gui-portable:
    name: gui portable (${{ matrix.name }})
    needs: verify
    # Release-track job: manual dispatch only (ADR-0010 Track 2).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-gui-portable
            ubuntuDeps: true
            bin: EgressAPIKEY
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-gui-portable
            ubuntuDeps: false
            bin: EgressAPIKEY.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-gui-portable-arm64
            ubuntuDeps: false
            bin: EgressAPIKEY
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: install Linux native deps
        if: matrix.ubuntuDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: fetch Resin Go sidecar binary (windows powershell / unix bash)
        shell: bash
        run: bash scripts/fetch_resin.sh
      - name: tauri build --no-bundle (portable binary)
        # custom-protocol MUST be passed (see installer job comment above).
        run: npx --no-install tauri build --no-bundle --features custom-protocol --target ${{ matrix.target }}
      - name: stage release/
        shell: bash
        run: |
          set -e
          STAGE="release/${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || \
            cp "src-tauri/target/release/${{ matrix.bin }}" "$STAGE/${{ matrix.bin }}" 2>/dev/null || true
          ls -lh "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.name }}/*
          if-no-files-found: error
