# Performance baseline benchmark (D-004).
#
# Runs scripts/bench/run-bench.mjs against a REAL Resin sidecar binary on both
# Windows and Linux runners. The harness reads GITHUB_RUN_ID /
# GITHUB_RUN_ATTEMPT / GITHUB_SHA / RUNNER_OS / ImageOS from the environment and
# stamps them into bench-results/results.json, so every artifact is CI-attested.
#
# Triggered manually (workflow_dispatch) and weekly (schedule). Not part of the
# PR gate — it is an evidence/regression runner.
name: perf-bench

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Benchmark duration profile (short=~10min, long=30min soak)"
        required: false
        default: "short"
        type: choice
        options: [short, long]
      gate:
        description: "Gate mode: warn never fails; enforce hard-fails on assertion/smoke breaches only (measurement rows are recorded, never fatal - D-002)"
        required: false
        default: "warn"
        type: choice
        options: [warn, enforce]
      with_app:
        description: "windows leg only: build the portable exe in-job so the whole-process-tree + cold-start phases produce numbers"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      phases:
        description: 'Comma-separated phase list; empty = default set + exe-gated app/headless phases. An explicit list is EXACT. "faultinject" (R12-C1) is opt-in evidence: needs real WAN egress to 1.1.1.1 and builds the headless SUT on both legs.'
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
    # r12-wave-d R12-D4b: monthly faultinject heartbeat (1st of month, 03:00
    # UTC). Two consecutive absent scheduled runs fire the trigger-line
    # register's monthly-faultinject line.
    - cron: "0 3 1 * *"

permissions: {}

jobs:
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rust toolchain (host triple detection for fetch_resin.sh)
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Resin sidecar binary
        run: bash scripts/fetch_resin.sh
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./crates/resin-core -> target"
          key: bench-forwarder-${{ runner.os }}

      # Mode A shell forwarder for the desktop-profile SSE legs. Feature-gated
      # bin: cargo build -p resin-core --features bench --bin bench-forwarder.
      - name: Build bench-forwarder (Mode A entry listener)
        run: >
          cargo build --release -p resin-core --features bench
          --bin bench-forwarder
          ${{ matrix.os == 'ubuntu-latest' && '--target x86_64-unknown-linux-gnu' || '' }}
        shell: bash

      - uses: pnpm/action-setup@v4
        if: matrix.os == 'windows-latest' && inputs.with_app == 'true'

      - name: Install frontend deps (windows app phases)
        if: matrix.os == 'windows-latest' && inputs.with_app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build portable app exe (windows, no bundle)
        if: matrix.os == 'windows-latest' && inputs.with_app == 'true'
        run: npx --no-install tauri build --no-bundle --features "custom-protocol headless"
        shell: bash

      # faultinject SUT = egressapikey-headless. The windows tauri build
      # (with_app=true) already emits it; everywhere else the feature-gated
      # cargo build produces it directly (no dist/ needed - the headless bin
      # never expands generate_context!).
      - name: Linux GUI-stack deps (faultinject headless build)
        if: matrix.os == 'ubuntu-latest' && (contains(inputs.phases, 'faultinject') || github.event_name == 'schedule')
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libxdo-dev libssl-dev build-essential curl wget file
        shell: bash

      - name: Build headless SUT (faultinject)
        if: (contains(inputs.phases, 'faultinject') || github.event_name == 'schedule') && !(matrix.os == 'windows-latest' && inputs.with_app == 'true')
        run: >
          cargo build --release -p egressapikey-app
          --bin egressapikey-headless --features headless
          ${{ matrix.os == 'ubuntu-latest' && '--target x86_64-unknown-linux-gnu' || '' }}
        shell: bash

      # R12-D4b dry-run verification for the schedule path: the resolved
      # PHASES_ARG/HEADLESS_ARG land in the job log, so a monthly heartbeat
      # run can be audited for what it would execute without touching the
      # gate. Identical expressions as the Run benchmark step below.
      - name: Resolve schedule/dispatch inputs (dry-run)
        env:
          PHASES_ARG: ${{ github.event_name == 'schedule' && '--phases idle,paired,rps,sse,soak,healthz,app,appstart,headless,headlessstart,faultinject' || (inputs.phases != '' && format('--phases {0}', inputs.phases) || '') }}
          HEADLESS_ARG: ${{ (matrix.os == 'windows-latest' && (inputs.with_app == 'true' || contains(inputs.phases, 'faultinject') || github.event_name == 'schedule')) && '--headless-exe target/x86_64-pc-windows-msvc/release/egressapikey-headless.exe' || (matrix.os == 'ubuntu-latest' && (contains(inputs.phases, 'faultinject') || github.event_name == 'schedule')) && '--headless-exe target/x86_64-unknown-linux-gnu/release/egressapikey-headless' || '' }}
        run: echo "[bench] event=${{ github.event_name }} duration=${{ inputs.duration || 'short' }} gate=${{ inputs.gate || 'warn' }} phases=[$PHASES_ARG] headless=[$HEADLESS_ARG]"
        shell: bash

      - name: Run benchmark
        env:
          # Schedule runs the explicit full default set + faultinject
          # (R12-D4b): the list is spelled out, not expanded from empty
          # input, so the monthly heartbeat is immune to default-list drift.
          PHASES_ARG: ${{ github.event_name == 'schedule' && '--phases idle,paired,rps,sse,soak,healthz,app,appstart,headless,headlessstart,faultinject' || (inputs.phases != '' && format('--phases {0}', inputs.phases) || '') }}
          HEADLESS_ARG: ${{ (matrix.os == 'windows-latest' && (inputs.with_app == 'true' || contains(inputs.phases, 'faultinject') || github.event_name == 'schedule')) && '--headless-exe target/x86_64-pc-windows-msvc/release/egressapikey-headless.exe' || (matrix.os == 'ubuntu-latest' && (contains(inputs.phases, 'faultinject') || github.event_name == 'schedule')) && '--headless-exe target/x86_64-unknown-linux-gnu/release/egressapikey-headless' || '' }}
        run: >
          node scripts/bench/run-bench.mjs
          --duration "${{ inputs.duration || 'short' }}"
          --gate "${{ inputs.gate || 'warn' }}"
          --forwarder "${{ matrix.os == 'windows-latest' && 'target/x86_64-pc-windows-msvc/release/bench-forwarder.exe' || 'target/x86_64-unknown-linux-gnu/release/bench-forwarder' }}"
          ${{ (matrix.os == 'windows-latest' && inputs.with_app == 'true') && '--app-exe target/x86_64-pc-windows-msvc/release/EgressAPIKEY.exe' || '' }}
          $PHASES_ARG $HEADLESS_ARG
        shell: bash

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.os }}-${{ github.sha }}
          path: |
            bench-results/results.json
            bench-results/SUMMARY.md
          retention-days: 90
