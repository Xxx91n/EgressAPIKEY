# Representative-hardware performance baseline (dual-layer perf bench).
#
# Runs the same scripts/bench/run-bench.mjs suite as bench.yml, but on the
# OPERATOR'S self-hosted runner registered on the representative machine
# (target: a 1C1G Linux VPS; this Windows box is the documented fallback).
# Numbers from this workflow are the ONLY basis for the absolute RSS /
# latency gates in docs/how-to/PERF-BENCH.md — the github-hosted bench.yml
# column is reference-only.
#
# SECURITY RAIL (public repo, GitHub's own self-hosted-runner warning):
# this workflow is workflow_dispatch-ONLY and MUST NOT gain
# pull_request/push triggers or fork contexts — a PR-triggered job on a
# self-hosted label is a hijack vector. Keep `runs-on: [self-hosted, ...]`
# confined to this file.
name: bench-selfhosted

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Benchmark duration profile (short=~10min, long=30min soak)"
        required: false
        default: "short"
        type: choice
        options: [short, long]
      runner_os:
        description: "Self-hosted runner OS label (linux preferred)"
        required: false
        default: "linux"
        type: choice
        options: [linux, windows]

permissions: {}

jobs:
  bench:
    name: representative baseline (${{ inputs.runner_os || 'linux' }})
    runs-on: [self-hosted, "${{ inputs.runner_os || 'linux' }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rust toolchain (host triple detection for fetch_resin.sh)
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Resin sidecar binary
        run: bash scripts/fetch_resin.sh
        shell: bash

      # Mode A shell forwarder (desktop-profile SSE legs); skipped silently
      # by the harness if the build is unavailable on the runner.
      - name: Build bench-forwarder (Mode A entry listener)
        run: >
          cargo build --release -p resin-core --features bench
          --bin bench-forwarder
          ${{ (inputs.runner_os || 'linux') == 'linux' && '--target x86_64-unknown-linux-gnu' || '' }}
        shell: bash

      # vps-headless profile: build the headless binary so the whole-tree
      # idle/startup phases produce numbers on the representative host.
      # Same recipe as ci.yml's backend matrix (tauri-build embeds
      # frontendDist, so pnpm build precedes cargo). continue-on-error: a
      # runner without the deps records the phases as skipped instead of
      # losing the whole run's evidence.
      - uses: pnpm/action-setup@v4
        if: (inputs.runner_os || 'linux') == 'linux'
        with:
          version: 9
      - name: Linux tauri deps for headless build
        if: (inputs.runner_os || 'linux') == 'linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - name: Install frontend deps (headless dist embed)
        if: (inputs.runner_os || 'linux') == 'linux'
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Build frontend dist
        if: (inputs.runner_os || 'linux') == 'linux'
        continue-on-error: true
        run: pnpm build
      - name: Build egressapikey-headless
        if: (inputs.runner_os || 'linux') == 'linux'
        continue-on-error: true
        run: cargo build --release --target x86_64-unknown-linux-gnu -p egressapikey-app --bin egressapikey-headless --features headless

      - name: Record host shape
        run: |
          mkdir -p bench-results
          {
            echo "runnerName=${RUNNER_NAME:-unknown}"
            echo "runnerOs=${RUNNER_OS:-unknown}"
            uname -a || true
            nproc || true
            (free -m | head -2) || true
          } | tee bench-results/host-shape.env
        shell: bash

      - name: Run benchmark
        run: >
          node scripts/bench/run-bench.mjs
          --duration "${{ inputs.duration || 'short' }}"
          --gate warn
          --forwarder "${{ (inputs.runner_os || 'linux') == 'windows' && 'target/x86_64-pc-windows-msvc/release/bench-forwarder.exe' || 'target/x86_64-unknown-linux-gnu/release/bench-forwarder' }}"
          --headless-exe "${{ (inputs.runner_os || 'linux') == 'windows' && 'target/x86_64-pc-windows-msvc/release/egressapikey-headless.exe' || 'target/x86_64-unknown-linux-gnu/release/egressapikey-headless' }}"
        shell: bash

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-selfhosted-${{ inputs.runner_os || 'linux' }}-${{ github.sha }}
          path: |
            bench-results/results.json
            bench-results/SUMMARY.md
            bench-results/host-shape.env
          retention-days: 365
